<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة علي - التوريدات الاحترافية للفاست فود</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff6600;
            --primary-dark: #e55c00;
            --secondary: #1d3557;
            --accent: #27ae60;
            --bg-body: #f4f6f9;
            --white: #ffffff;
            --text-main: #212529;
            --gray-light: #f8f9fa;
            --border-color: #dee2e6;
            --shadow-soft: 0 10px 30px rgba(0,0,0,0.05);
            --shadow-hover: 0 20px 40px rgba(255, 102, 0, 0.15);
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* الهيدر العلوي المتحرك */
        .top-navbar {
            background: var(--white);
            padding: 15px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary);
            text-decoration: none;
            transition: var(--transition);
        }
        .brand-logo:hover { transform: scale(1.05); }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-trigger-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(29, 53, 87, 0.2);
        }

        .admin-trigger-btn:hover {
            background: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .cart-toggle-btn {
            background: var(--primary);
            color: white;
            padding: 10px 22px;
            border-radius: 35px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 102, 0, 0.3);
            transition: var(--transition);
        }

        .cart-toggle-btn:hover {
            transform: scale(1.05);
            background: var(--primary-dark);
        }

        .cart-counter-badge {
            background: white;
            color: var(--primary);
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 0.85rem;
            font-weight: 900;
        }

        /* شريط البحث الفاخر */
        .search-wrapper {
            background: linear-gradient(135deg, #1d3557, #0f172a);
            padding: 35px 20px;
            display: flex;
            justify-content: center;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.1);
        }

        .search-bar-box {
            width: 100%;
            max-width: 900px;
            display: flex;
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 40px;
            overflow: hidden;
            background: var(--white);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: var(--transition);
        }

        .search-bar-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 5px rgba(255, 102, 0, 0.2);
        }

        .search-bar-box input {
            flex: 1;
            padding: 15px 30px;
            border: none;
            outline: none;
            font-size: 1.1rem;
        }

        .search-bar-box button {
            background: var(--primary);
            border: none;
            padding: 0 40px;
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .search-bar-box button:hover { background: var(--primary-dark); }

        /* هيكل الصفحة */
        .main-container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2.8fr 1fr;
            gap: 30px;
        }

        @media (max-width: 992px) {
            .main-container { grid-template-columns: 1fr; }
        }

        /* التصنيفات المتحركة (Categories) */
        .categories-filter {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 30px;
            scroll-behavior: smooth;
        }
        .categories-filter::-webkit-scrollbar { height: 6px; }
        .categories-filter::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }

        .category-chip {
            background: var(--white);
            border: 2px solid var(--border-color);
            padding: 12px 25px;
            border-radius: 35px;
            cursor: pointer;
            font-weight: 800;
            font-size: 1rem;
            white-space: nowrap;
            color: var(--secondary);
            box-shadow: var(--shadow-soft);
            transition: var(--transition);
        }

        .category-chip:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }

        .category-chip.active {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
            box-shadow: 0 10px 25px rgba(255, 102, 0, 0.3);
            transform: translateY(-4px);
        }

        /* شبكة المنتجات وحركات الكروت (Cards Hover Effects) */
        .products-showcase {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        .product-item-card {
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(0,0,0,0.04);
            position: relative;
        }

        /* حركة التموضع والرفع عند الوقوف بالماوس */
        .product-item-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: var(--shadow-hover);
            border-color: rgba(255, 102, 0, 0.3);
        }

        .product-discount-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--accent);
            color: white;
            font-size: 0.8rem;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 20px;
            z-index: 2;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
        }

        .product-icon-box {
            height: 170px;
            background: linear-gradient(135deg, #fff5eb, #ffe8d6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.2rem;
            position: relative;
            transition: var(--transition);
        }

        /* حركة زووم لطيفة على الأيقونة عند الهوفر */
        .product-item-card:hover .product-icon-box {
            transform: scale(1.08);
        }

        .product-content-area {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-name-txt {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--secondary);
            height: 48px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .pricing-box {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .current-val {
            color: var(--primary);
            font-weight: 900;
            font-size: 1.3rem;
        }

        .old-val {
            color: #95a5a6;
            font-size: 0.95rem;
            text-decoration: line-through;
            font-weight: 600;
        }

        .add-btn-action {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            padding: 12px;
            border-radius: 14px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.3);
            font-size: 1rem;
        }

        .add-btn-action:hover {
            background-color: var(--primary-dark);
            box-shadow: 0 6px 20px rgba(255, 102, 0, 0.5);
            transform: scale(1.03);
        }

        /* سلة الطلبات الجانبية الثابتة */
        .cart-sidebar-panel {
            background: var(--white);
            padding: 25px;
            border-radius: 20px;
            box-shadow: var(--shadow-soft);
            height: fit-content;
            position: sticky;
            top: 100px;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .cart-panel-title {
            font-size: 1.4rem;
            font-weight: 900;
            margin-bottom: 20px;
            color: var(--secondary);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-items-scroll {
            list-style: none;
            max-height: 320px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .cart-items-scroll::-webkit-scrollbar { width: 5px; }
        .cart-items-scroll::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }

        .cart-row-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .cart-row-item:hover { background: #fafafa; padding-right: 5px; }

        .cart-item-details h6 {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--secondary);
        }

        .cart-item-details span {
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 700;
        }

        .qty-adjuster {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .q-btn-ctrl {
            background: var(--gray-light);
            border: 1px solid var(--border-color);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
        }

        .q-btn-ctrl:hover { background: var(--primary); color: white; transform: scale(1.1); }

        .trash-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 1.1rem;
            transition: var(--transition);
        }
        .trash-btn:hover { transform: scale(1.2); }

        .total-summary-box {
            background: var(--gray-light);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 20px;
            font-weight: 900;
            display: flex;
            justify-content: space-between;
            font-size: 1.25rem;
            color: var(--secondary);
        }

        .form-input-box {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            font-size: 1rem;
            outline: none;
            margin-bottom: 15px;
            transition: var(--transition);
            background: #fafafa;
        }

        .form-input-box:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(255, 102, 0, 0.1);
        }

        .whatsapp-send-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 14px;
            font-weight: 900;
            font-size: 1.15rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
            transition: var(--transition);
        }

        .whatsapp-send-btn:hover {
            background-color: #20ba5a;
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(37, 211, 102, 0.6);
        }

        /* نافذة لوحة التحكم (Admin Modal) */
        .admin-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .admin-modal-card {
            background: white;
            width: 90%;
            max-width: 950px;
            max-height: 90vh;
            border-radius: 25px;
            padding: 35px;
            overflow-y: auto;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .admin-data-table th, .admin-data-table td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: center;
            font-size: 0.95rem;
        }

        .admin-data-table th { background: var(--secondary); color: white; }

        #toast-alert {
            visibility: hidden;
            min-width: 270px;
            background-color: var(--secondary);
            color: #fff;
            text-align: center;
            border-radius: 14px;
            padding: 16px;
            position: fixed;
            z-index: 3000;
            left: 50%; bottom: 35px;
            transform: translateX(-50%);
            font-weight: 800;
            border-right: 6px solid var(--primary);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        #toast-alert.show { visibility: visible; animation: alertSlideUp 0.4s, alertFadeOut 0.4s 2.3s; }
        @keyframes alertSlideUp { from { bottom: 0; opacity: 0; } to { bottom: 35px; opacity: 1; } }
        @keyframes alertFadeOut { from { bottom: 35px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body>

    <!-- الهيدر الاحترافي -->
    <nav class="top-navbar">
        <div class="nav-brand">
            <a href="#" class="brand-logo">شركة علي 🍔</a>
        </div>
        <div class="nav-actions">
            <button class="admin-trigger-btn" onclick="openAdminPanel()">⚙️ لوحة التحكم</button>
            <button class="cart-toggle-btn">
                🛒 السلة <span class="cart-counter-badge" id="nav-cart-count">0</span>
            </button>
        </div>
    </nav>

    <!-- شريط البحث الفاخر -->
    <div class="search-wrapper">
        <div class="search-bar-box">
            <input type="text" id="search-input" placeholder="ابحث في أصناف شركة الصفا للتوريدات (برجر، بطاطس، صوصات، أجبان)..." onkeyup="renderProducts()">
            <button>🔍</button>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-container">
        <div>
            <!-- التصنيفات المتحركة -->
            <div class="categories-filter">
                <button class="category-chip active" onclick="setCategory('all', this)">✨ الكل (73 صنف)</button>
                <button class="category-chip" onclick="setCategory('burgers', this)">🍔 استربس وبرجر</button>
                <button class="category-chip" onclick="setCategory('fries', this)">🍟 بطاطس</button>
                <button class="category-chip" onclick="setCategory('sauces', this)">🥫 صوصات ودريسينج</button>
                <button class="category-chip" onclick="setCategory('cheese', this)">🧀 أجبان ومقبلات</button>
                <button class="category-chip" onclick="setCategory('spices', this)">🧂 توابل وبهارات</button>
            </div>

            <!-- شبكة المنتجات التفاعلية -->
            <div class="products-showcase" id="products-grid"></div>
        </div>

        <!-- سلة المشتريات الجانبية -->
        <div class="cart-sidebar-panel">
            <div class="cart-panel-title">
                <span>سلة الطلبات</span>
                <span style="font-size: 0.9rem; color: var(--primary);" id="items-count-text">0 أصناف</span>
            </div>

            <ul class="cart-items-scroll" id="cart-items-list">
                <div style="text-align: center; color: #888; padding: 30px;">السلة فارغة حالياً</div>
            </ul>

            <div class="total-summary-box">
                <span>الإجمالي:</span>
                <span id="cart-total-price">0 ج.م</span>
            </div>

            <input type="text" id="shop-name" class="form-input-box" placeholder="اسم المحل أو المطعم *">
            <input type="text" id="shop-phone" class="form-input-box" placeholder="رقم الهاتف للتواصل *">

            <button class="whatsapp-send-btn" onclick="sendToWhatsApp()">
                إرسال الطلب عبر واتساب 📱
            </button>
        </div>
    </div>

    <!-- نافذة لوحة التحكم -->
    <div class="admin-overlay" id="adminModal">
        <div class="admin-modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px;">
                <h2>⚙️ لوحة تحكم شركة علي</h2>
                <button onclick="closeAdminPanel()" style="background:none; border:none; font-size:1.8rem; cursor:pointer; color:var(--primary);">✕</button>
            </div>
            
            <h3 style="margin-bottom: 12px; color: var(--secondary);">إضافة صنف جديد للقائمة</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                <input type="text" id="new-name" class="form-input-box" placeholder="اسم الصنف" style="margin:0;">
                <input type="number" id="new-price" class="form-input-box" placeholder="السعر (ج.م)" style="margin:0;">
                <select id="new-cat" class="form-input-box" style="margin:0;">
                    <option value="burgers">🍔 استربس وبرجر</option>
                    <option value="fries">🍟 بطاطس</option>
                    <option value="sauces">🥫 صوصات ودريسينج</option>
                    <option value="cheese">🧀 أجبان ومقبلات</option>
                    <option value="spices">🧂 توابل وبهارات</option>
                </select>
            </div>
            <button onclick="addNewProduct()" style="background: var(--primary); color: white; border:none; padding: 14px; width:100%; border-radius:12px; font-weight:bold; cursor:pointer; margin-bottom:30px; font-size: 1.05rem;">➕ إضافة الصنف الجديد</button>

            <h3 style="margin-bottom: 12px; color: var(--secondary);">إدارة المنتجات (73 صنف)</h3>
            <div style="max-height: 300px; overflow-y: auto;">
                <table class="admin-data-table">
                    <thead>
                        <tr>
                            <th>الصنف</th>
                            <th>السعر</th>
                            <th>القسم</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast-alert">تمت الإضافة بنجاح! ✨</div>

    <script>

        localStorage.setItem('ali_products_v3', JSON.stringify(defaultProducts));
        let products = JSON.parse(localStorage.getItem('ali_products_v3'));
        let cart = [];
        let currentCategory = 'all';

        function saveProducts() {
            localStorage.setItem('ali_products_v3', JSON.stringify(products));
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = products.filter(p => {
                const matchesCategory = currentCategory === 'all' || p.category === currentCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchVal);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #666; font-weight: bold; font-size: 1.2rem;">عذراً، لم نجد نتائج مطابقة لبحثك! 🔍</div>`;
                return;
            }

            filtered.forEach(product => {
                let oldPrice = Math.round(product.price * 1.1);

                grid.innerHTML += `
                    <div class="product-item-card">
                        <span class="product-discount-tag">خصم 10%</span>
                        <div class="product-icon-box">${product.emoji || '📦'}</div>
                        <div class="product-content-area">
                            <div class="product-name-txt">${product.name}</div>
                            <div class="pricing-box">
                                <span class="current-val">${product.price} ج.م</span>
                                <span class="old-val">${oldPrice} ج.م</span>
                            </div>
                            <button class="add-btn-action" onclick="addToCart(${product.id})">أضف للسلة 🛒</button>
                        </div>
                    </div>
                `;
            });
        }

        function setCategory(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.category-chip').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts();
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if (existing) { existing.quantity += 1; }
            else { cart.push({ ...product, quantity: 1 }); }
            updateCartUI();
            showAlert(`تمت إضافة "${product.name}" للسلة بنجاح ✨`);
        }

        function updateCartUI() {
            const list = document.getElementById('cart-items-list');
            const totalEl = document.getElementById('cart-total-price');
            const countBadge = document.getElementById('nav-cart-count');
            const itemsCountText = document.getElementById('items-count-text');

            list.innerHTML = '';
            if (cart.length === 0) {
                list.innerHTML = `<div style="text-align: center; color: #888; padding: 30px;">السلة فارغة حالياً</div>`;
                totalEl.innerText = '0 ج.م';
                countBadge.innerText = '0';
                itemsCountText.innerText = '0 أصناف';
                return;
            }

            let total = 0, totalCount = 0;
            cart.forEach(item => {
                total += item.price * item.quantity;
                totalCount += item.quantity;
                list.innerHTML += `
                    <li class="cart-row-item">
                        <div class="cart-item-details">
                            <h6>${item.name}</h6>
                            <span>${item.price} ج.م × ${item.quantity}</span>
                        </div>
                        <div class="qty-adjuster">
                            <button class="q-btn-ctrl" onclick="changeQty(${item.id}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button class="q-btn-ctrl" onclick="changeQty(${item.id}, 1)">+</button>
                            <button class="trash-btn" onclick="removeItem(${item.id})">🗑️</button>
                        </div>
                    </li>
                `;
            });

            totalEl.innerText = total + ' ج.م';
            countBadge.innerText = totalCount;
            itemsCountText.innerText = `${cart.length} أنواع (${totalCount} قطعة)`;
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) cart = cart.filter(i => i.id !== id);
                updateCartUI();
            }
        }

        function removeItem(id) {
            cart = cart.filter(i => i.id !== id);
            updateCartUI();
        }

        function openAdminPanel() {
            let pass = prompt("أدخل كلمة مرور لوحة التحكم:");
            if (pass === "1234") {
                document.getElementById('adminModal').style.display = 'flex';
                renderAdminTable();
            } else if (pass !== null) { showAlert("كلمة المرور غير صحيحة!"); }
        }

        function closeAdminPanel() {
            document.getElementById('adminModal').style.display = 'none';
            renderProducts();
        }

        function renderAdminTable() {
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = '';
            products.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.emoji} ${p.name}</td>
                        <td>${p.price} ج.م</td>
                        <td>${p.category}</td>
                        <td><button onclick="deleteProduct(${p.id})" style="background:var(--primary); color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:bold;">حذف</button></td>
                    </tr>
                `;
            });
        }

        function addNewProduct() {
            const name = document.getElementById('new-name').value.trim();
            const price = parseFloat(document.getElementById('new-price').value);
            const category = document.getElementById('new-cat').value;

            if (!name || isNaN(price)) { showAlert("يرجى إدخال اسم الصنف والسعر بشكل صحيح"); return; }
            const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
            products.push({ id: newId, name, price, category, emoji: '📦' });
            saveProducts();
            renderAdminTable();
            document.getElementById('new-name').value = '';
            document.getElementById('new-price').value = '';
            showAlert("تمت إضافة المنتج بنجاح!");
        }

        function deleteProduct(id) {
            if (confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
                products = products.filter(p => p.id !== id);
                saveProducts();
                renderAdminTable();
                showAlert("تم حذف المنتج بنجاح!");
            }
        }

        function sendToWhatsApp() {
            const shopName = document.getElementById('shop-name').value.trim();
            const shopPhone = document.getElementById('shop-phone').value.trim();

            if (cart.length === 0) { showAlert('السلة فارغة، يرجى اختيار منتجات أولاً!'); return; }
            if (!shopName || !shopPhone) { showAlert('يرجى كتابة اسم المحل ورقم الهاتف للتواصل!'); return; }

            let message = `*📦 طلبية جديدة - شركة علي للتوريدات*\n\n`;
            message += `🏪 *اسم المحل:* ${shopName}\n`;
            message += `📞 *رقم الهاتف:* ${shopPhone}\n`;
            message += `------------------------------------\n`;
            let total = 0;
            cart.forEach((item, idx) => {
                let sub = item.price * item.quantity;
                total += sub;
                message += `${idx + 1}. *${item.name}* (${item.quantity} قطعة) - ${sub} ج.م\n`;
            });
            message += `------------------------------------\n`;
            message += `💰 *إجمالي الفاتورة التقديري:* *${total} ج.م*\n\n`;
            message += `_برجاء مراجعة الطلب وتأكيد موعد التوصيل._`;

            const whatsappNumber = "201000000000"; // استبدل الرقم برقم واتساب علي الفعلي
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function showAlert(txt) {
            const alertBox = document.getElementById('toast-alert');
            alertBox.innerText = txt;
            alertBox.className = "show";
            setTimeout(() => { alertBox.className = ""; }, 2500);
        }

        renderProducts();
    </script>
