<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة علي - توريدات مجمدات الفاست فود</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e63946;
            --secondary: #1d3557;
            --accent: #ffb703;
            --bg-light: #f4f6f9;
            --white: #ffffff;
            --text-dark: #212529;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        /* الهيدر */
        header {
            background: linear-gradient(135deg, var(--secondary), #0f172a);
            color: var(--white);
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            font-weight: 900;
        }

        header p {
            font-size: 1.1rem;
            color: var(--accent);
        }

        /* المحتوى الرئيسي */
        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: 2.2fr 1fr;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* الأقسام (التصنيفات) */
        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .cat-btn {
            background: var(--white);
            border: 2px solid #ddd;
            padding: 8px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

        /* شبكة المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--white);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .product-img {
            height: 140px;
            background: #fff3e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
        }

        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--secondary);
        }

        .product-price {
            color: var(--primary);
            font-weight: 900;
            font-size: 1.15rem;
        }

        .add-btn {
            background-color: var(--secondary);
            color: var(--white);
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-btn:hover {
            background-color: var(--primary);
        }

        /* سلة المشتريات */
        .cart-box {
            background: var(--white);
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .cart-title {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 15px;
            color: var(--secondary);
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-badge {
            background: var(--primary);
            color: white;
            font-size: 0.85rem;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .cart-items-list {
            list-style: none;
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-left: 5px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f1f1f1;
            font-size: 0.95rem;
        }

        .item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            background: #eee;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .qty-btn:hover {
            background: #ddd;
        }

        .remove-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            margin-right: 5px;
        }

        .cart-total {
            font-size: 1.25rem;
            font-weight: 900;
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .whatsapp-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .whatsapp-btn:hover {
            background-color: #1ebe5d;
        }

        .empty-cart {
            text-align: center;
            color: #888;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>شركة علي للمجمدات والفاست فود</h1>
        <p>التوريدات الرسمية لأصحاب المطاعم ومحلات الفاست فود بجودة عالية</p>
    </header>

    <div class="container">
        <!-- قسم المنتجات -->
        <div>
            <!-- الأقسام -->
            <div class="categories">
                <button class="cat-btn active" onclick="filterProducts('all', this)">الكل</button>
                <button class="cat-btn" onclick="filterProducts('burgers', this)">🍔 البرجر والدجاج</button>
                <button class="cat-btn" onclick="filterProducts('fries', this)">🍟 البطاطس</button>
                <button class="cat-btn" onclick="filterProducts('frozen', this)">🧀 مجمدات ومقبلات</button>
            </div>

            <!-- شبكة المنتجات -->
            <div class="products-grid" id="products-grid">
                <!-- يتم تعبئتها بالجافاسكريبت -->
            </div>
        </div>

        <!-- سلة المشتريات -->
        <div class="cart-box">
            <div class="cart-title">
                <span>سلة الطلبات</span>
                <span class="cart-badge" id="cart-count">0</span>
            </div>

            <ul class="cart-items-list" id="cart-items-list">
                <li class="empty-cart">السلة فارغة حالياً</li>
            </ul>

            <div class="cart-total">
                <span>الإجمالي:</span>
                <span id="cart-total-price">0 ج.م</span>
            </div>

            <div class="form-group">
                <label for="shop-name">اسم المحل / المطعم:</label>
                <input type="text" id="shop-name" placeholder="اكتب اسم محلك هنا...">
            </div>

            <div class="form-group">
                <label for="shop-phone">رقم الهاتف:</label>
                <input type="text" id="shop-phone" placeholder="رقم للتواصل مع المندوب...">
            </div>

            <button class="whatsapp-btn" onclick="sendToWhatsApp()">
                إرسال الطلب عبر الواتساب 📱
            </button>
        </div>
    </div>

    <script>
        // قاعدة بيانات المنتجات مع التصنيفات
        const products = [
            { id: 1, name: "برجر بقري جامبو (قطعة)", price: 15, category: "burgers", emoji: "🍔" },
            { id: 2, name: "برجر دجاج كرسبي (قطعة)", price: 14, category: "burgers", emoji: "🍗" },
            { id: 3, name: "استربس دجاج حار (كيلو)", price: 140, category: "burgers", emoji: "🔥" },
            { id: 4, name: "ناجتس دجاج (كيلو)", price: 110, category: "burgers", emoji: "🧊" },
            
            { id: 5, name: "بطاطس نصف فروم (كيس 2.5 كجم)", price: 95, category: "fries", emoji: "🍟" },
            { id: 6, name: "بطاطس كويك ويدجز (كيس)", price: 105, category: "fries", emoji: "🥔" },

            { id: 7, name: "أصابع موزاريلا مجمدة (كيس)", price: 120, category: "frozen", emoji: "🧀" },
            { id: 8, name: "حلقات بصل مقرمشة (كيلو)", price: 85, category: "frozen", emoji: "🧅" },
            { id: 9, name: "سبرنج رول خضار (باكت)", price: 70, category: "frozen", emoji: "🥟" }
        ];

        let cart = [];

        // عرض المنتجات بناءً على التصنيف
        function renderProducts(category = 'all') {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            const filtered = category === 'all' 
                ? products 
                : products.filter(p => p.category === category);

            filtered.forEach(product => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-img">${product.emoji}</div>
                        <div class="product-info">
                            <div class="product-name">${product.name}</div>
                            <div class="product-price">${product.price} ج.م</div>
                            <button class="add-btn" onclick="addToCart(${product.id})">إضافة للسلة</button>
                        </div>
                    </div>
                `;
            });
        }

        // فلترة الأقسام عند الضغط على الأزرار
        function filterProducts(category, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts(category);
        }

        // إضافة منتج للسلة
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);

            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
        }

        // زيادة الكمية داخل السلة
        function increaseQty(productId) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity += 1;
                updateCartUI();
            }
        }

        // تقليل الكمية داخل السلة
        function decreaseQty(productId) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity -= 1;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== productId);
                }
                updateCartUI();
            }
        }

        // إزالة منتج نهائياً من السلة
        function removeFromCart(productId) {
            cart = cart.filter(i => i.id !== productId);
            updateCartUI();
        }

        // تحديث واجهة السلة بالكامل
        function updateCartUI() {
            const list = document.getElementById('cart-items-list');
            const totalEl = document.getElementById('cart-total-price');
            const countBadge = document.getElementById('cart-count');

            list.innerHTML = '';

            if (cart.length === 0) {
                list.innerHTML = '<li class="empty-cart">السلة فارغة حالياً</li>';
                totalEl.innerText = '0 ج.م';
                countBadge.innerText = '0';
                return;
            }

            let total = 0;
            let totalCount = 0;

            cart.forEach(item => {
                let itemTotal = item.price * item.quantity;
                total += itemTotal;
                totalCount += item.quantity;

                list.innerHTML += `
                    <li class="cart-item">
                        <div>
                            <strong>${item.name}</strong><br>
                            <small>${item.price} ج.م × ${item.quantity}</small>
                        </div>
                        <div class="item-controls">
                            <button class="qty-btn" onclick="decreaseQty(${item.id})">-</button>
                            <span>${item.quantity}</span>
                            <button class="qty-btn" onclick="increaseQty(${item.id})">+</button>
                            <button class="remove-btn" onclick="removeFromCart(${item.id})">×</button>
                        </div>
                    </li>
                `;
            });

            totalEl.innerText = total + ' ج.م';
            countBadge.innerText = totalCount;
        }

        // إرسال الطلب عبر الواتساب
        function sendToWhatsApp() {
            const shopName = document.getElementById('shop-name').value.trim();
            const shopPhone = document.getElementById('shop-phone').value.trim();

            if (cart.length === 0) {
                alert('يرجى إضافة منتجات إلى السلة أولاً!');
                return;
            }
            if (!shopName) {
                alert('يرجى كتابة اسم المحل أو المطعم!');
                return;
            }

            let message = `*طلب جملة جديد من شركة علي للمجمدات* 🛒\n\n`;
            message += `🏪 *اسم المحل:* ${shopName}\n`;
            if (shopPhone) message += `📞 *رقم الهاتف:* ${shopPhone}\n`;
            message += `--------------------------\n`;
            message += `*المنتجات المطلوبة:*\n`;

            let total = 0;
            cart.forEach(item => {
                let subTotal = item.price * item.quantity;
                total += subTotal;
                message += `▪️ ${item.name} | الكمية: ${item.quantity} | الإجمالي: ${subTotal} ج.م\n`;
            });

            message += `--------------------------\n`;
            message += `💰 *إجمالي الفاتورة الكلي:* *${total} ج.م*\n`;

            // استبدل الرقم برقم واتساب شركة علي الفعلي (مسبوقاً برمز الدولة 20)
            const whatsappNumber = "201000000000";

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${whatsappNumber}?text=${encodedMessage}`, '_blank');
        }

        // التشغيل الأولي للموقع
        renderProducts();
    </script>
</body>
</html>
